name: TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build, such as v0.10.0
        required: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -q iphoneos || xcodebuild -downloadPlatform iOS
      - run: brew install xcodegen
      - name: Restore signing credentials
        shell: bash
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE: ${{ secrets.IOS_APP_STORE_PROFILE }}
          IOS_ASC_KEY_P8: ${{ secrets.IOS_ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_ASC_KEY_P8" | base64 -D > "$RUNNER_TEMP/asc.p8"
          printf '%s' "$IOS_APP_STORE_PROFILE" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          UUID="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          SIGNING_KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SIGNING_KEYCHAIN_PASSWORD"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$SIGNING_KEYCHAIN" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
        # The version stays at project.yml's own, so a build of a version TestFlight already reviewed usually skips review.
        run: ios/testflight.sh
      - name: Send the build to public testers
        env:
          ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          APP_ID: "6832179998"
          GROUP_NAME: Public
        run: |
          node --input-type=module <<'JS'
          import { createPrivateKey, createSign } from "node:crypto";
          import { readFileSync } from "node:fs";

          const { ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_PATH, APP_ID, GROUP_NAME } = process.env;
          const key = createPrivateKey(readFileSync(ASC_KEY_PATH));
          const part = (value) => Buffer.from(JSON.stringify(value)).toString("base64url");
          function token() {
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${part({ alg: "ES256", kid: ASC_KEY_ID, typ: "JWT" })}.${part({ iss: ASC_ISSUER_ID, iat: now, exp: now + 900, aud: "appstoreconnect-v1" })}`;
            return `${unsigned}.${createSign("SHA256").update(unsigned).sign({ key, dsaEncoding: "ieee-p1363" }).toString("base64url")}`;
          }
          async function api(method, path, body) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method,
              headers: { Authorization: `Bearer ${token()}`, "Content-Type": "application/json" },
              body: body && JSON.stringify(body),
            });
            const text = await response.text();
            return { status: response.status, body: text ? JSON.parse(text) : null };
          }

          // The upload is still processing; wait for the newest build to become usable.
          let build;
          for (let attempt = 0; attempt < 90; attempt += 1) {
            const found = await api("GET", `/v1/builds?filter[app]=${APP_ID}&sort=-uploadedDate&limit=1&fields[builds]=version,processingState`);
            build = found.body?.data?.[0];
            const state = build?.attributes.processingState;
            if (state === "VALID") break;
            if (state === "FAILED" || state === "INVALID") throw new Error(`Build ${build.attributes.version} is ${state}.`);
            await new Promise((resolve) => setTimeout(resolve, 20_000));
          }
          if (build?.attributes.processingState !== "VALID") throw new Error("The build did not finish processing in time.");
          console.log(`Build ${build.attributes.version} is ready.`);

          const groups = await api("GET", `/v1/betaGroups?filter[app]=${APP_ID}&filter[name]=${encodeURIComponent(GROUP_NAME)}`);
          const group = groups.body?.data?.[0];
          if (!group) throw new Error(`No TestFlight group named ${GROUP_NAME}.`);

          const notes = await api("POST", "/v1/betaBuildLocalizations", {
            data: { type: "betaBuildLocalizations", attributes: { locale: "en-US", whatsNew: "Matches the latest AI Coding Tool release for your computer." }, relationships: { build: { data: { type: "builds", id: build.id } } } },
          });
          if (notes.status >= 400 && notes.status !== 409) throw new Error(`Test notes: ${JSON.stringify(notes.body)}`);

          const added = await api("POST", `/v1/betaGroups/${group.id}/relationships/builds`, { data: [{ type: "builds", id: build.id }] });
          if (added.status >= 400) throw new Error(`Adding to ${GROUP_NAME}: ${JSON.stringify(added.body)}`);

          // Only a build nobody has submitted yet is sent for review; one already waiting, in review or live is left as it is.
          const detail = await api("GET", `/v1/builds/${build.id}/buildBetaDetail`);
          const external = detail.body?.data?.attributes.externalBuildState;
          if (external !== "READY_FOR_BETA_SUBMISSION") {
            console.log(`Sent to ${GROUP_NAME}; beta review is ${external}.`);
          } else {
            const submitted = await api("POST", "/v1/betaAppReviewSubmissions", {
              data: { type: "betaAppReviewSubmissions", relationships: { build: { data: { type: "builds", id: build.id } } } },
            });
            if (submitted.status >= 400) throw new Error(`Beta review: ${JSON.stringify(submitted.body)}`);
            console.log(`Sent to ${GROUP_NAME}; beta review is ${submitted.body.data.attributes.betaReviewState}.`);
          }
          JS
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          SIGNING_KEYCHAIN="$RUNNER_TEMP/ios-signing.keychain-db"
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/profile.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${IOS_PROFILE_UUID:-none}.mobileprovision"
