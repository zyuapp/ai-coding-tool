name: Relay

on:
  push:
    branches: [main]
    paths:
      - relay/**
      - .github/workflows/relay.yml
  workflow_dispatch:

concurrency:
  group: relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the Worker and its APNs secrets
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/relay-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          node -e '
            const names = ["APNS_KEY", "APNS_KEY_ID", "APPLE_TEAM_ID"];
            const missing = names.filter((name) => !process.env[name]);
            if (missing.length) { console.error(`Missing secrets: ${missing.join(", ")}`); process.exit(1); }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))), { mode: 0o600 });
          ' "$secrets"
          npx --yes wrangler@4 deploy --secrets-file "$secrets"
      - name: Check the relay answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS https://aicodingtool-relay.zyuapp.workers.dev/health; then exit 0; fi
            sleep 5
          done
          exit 1
